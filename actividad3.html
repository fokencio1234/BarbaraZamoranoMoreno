<!DOCTYPE html>
<html>

<head>

    <title>Actividad 3 - Onda Senoidal</title>

    <style>

        body {
            background-color: #ffbfd2;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        canvas {
            border: 3px solid #a9002a;
            background-color: #fff0fd;
        }

        h1 {
            font-family: Arial, Helvetica, sans-serif;
            color: #c1004d;
        }

    </style>

</head>

<body>

 <h1>A3 - Animación con onda senoidal/coseno</h1>

    <canvas id="canvas" width="1100" height="600"></canvas>



    <script>

        // Obtener el canvas
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        // Cargar la imagen
        const imagen = new Image();
        imagen.src = "beagle.png";

        // Contador de la animación
        let tiempo = 0;

        // Función de animación
        function animar() {

            // Limpiar el canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // POSICIÓN
            // Movimiento horizontal con seno
            let x = canvas.width / 2 + Math.sin(tiempo) * 400;

            // Movimiento vertical con coseno
            let y = canvas.height / 2 + Math.cos(tiempo) * 50;

            // ESCALA
            // El tamaño cambia como un pulso
            let escala = 1 + Math.sin(tiempo * 2) * 0.35;

            // Tamaño original de la imagen
            let ancho = 300;
            let alto = 300;

            // Aplicar la escala
            ancho = ancho * escala;
            alto = alto * escala;

            // Guardar el estado del canvas
            ctx.save();

            // Dibujar la imagen desde el centro
            ctx.drawImage(
                imagen,
                x - ancho / 2,
                y - alto / 2,
                ancho,
                alto
            );

            // Restaurar el canvas
            ctx.restore();

            // Incrementar el tiempo
            tiempo += 0.03;

            // Repetir la animación
            requestAnimationFrame(animar);
        }

        // Iniciar cuando la imagen cargue
        imagen.onload = function() {
            animar();
        };

    </script>

</body>

</html>
